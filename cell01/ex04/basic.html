<!DOCTYPE html>
<html>
<head>
  <title>Basics</title>
  <style>
    body {
      background-color: pink; /* Pink background */
      margin: 0;
      font-family: Arial, sans-serif;
    }
    h1 {
      text-align: center;
      font-size: 50px;
      color: white;
    }
    .images {
      display: flex;
      justify-content: center;
      gap: 30px;
      margin-top: 20px;
    }
    .images div {
      text-align: center;
    }
    hr {
      margin: 40px 0;
      border: 1px solid black;
    }
    .footer {
      text-align: right;
      font-style: italic;
      font-family: monospace;
      margin-right: 20px;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <!-- Title with special character -->
  <h1>Welcome to the Shop ✨</h1>

  <!-- Two images side by side with links underneath -->
  <div class="images">
    <div>
      <img src="amazon.jpg" alt="Amazon" width="250"><br>
      <a href="https://www.amazon.com" target="_blank">Visit Amazon</a>
    </div>
    <div>
      <img src="ebay.jpg" alt="eBay" width="250"><br>
      <a href="https://www.ebay.com" target="_blank">Visit eBay</a>
    </div>
  </div>

  <!-- Horizontal line -->
  <hr>

  <!-- Footer -->
  <div class="footer">
    © wil 2025
  </div>
</body>
</html>
