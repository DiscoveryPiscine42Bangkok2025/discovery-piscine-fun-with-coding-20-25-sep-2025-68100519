<!DOCTYPE html>
<html>
<head>
  <title>Two Cells Table</title>
  <style>
    table {
      width: 100%;
      border-collapse: collapse;
    }
    td {
      border: 1px solid black;
      padding: 30px;
      text-align: center;
      font-size: 18px;
    }
    .cell1 {
      background-color: lightgreen;
    }
    .cell2 {
      background-color: lightcoral;
    }
  </style>
</head>
<body>
  <h2>Make a web page with a table of two boxes like:</h2>
  <table>
    <tr>
      <td class="cell1">First cell</td>
      <td class="cell2">Second cell</td>
    </tr>
  </table>
</body>
</html>
