<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Balloon</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #f5f5f5;
    }

    #balloon {
      width: 200px;
      height: 200px;
      border-radius: 50%;
      background-color: red;
      transition: all 0.3s ease;
      cursor: pointer;
      user-select: none;
    }
  </style>
</head>
<body>
  <div id="balloon"></div>

  <script>
    const balloon = document.getElementById("balloon");

    let size = 200;
    let colors = ["red", "green", "blue"];
    let colorIndex = 0;

    // Handle click = grow + next color
    balloon.addEventListener("click", () => {
      size += 10;
      colorIndex = (colorIndex + 1) % colors.length;

      if (size > 420) {
        // Balloon explodes → reset
        size = 200;
        colorIndex = 0;
      }

      updateBalloon();
    });

    // Handle mouseleave = shrink + previous color
    balloon.addEventListener("mouseleave", () => {
      size = Math.max(200, size - 5); // not smaller than 200
      colorIndex = (colorIndex - 1 + colors.length) % colors.length;
      updateBalloon();
    });

    function updateBalloon() {
      balloon.style.width = size + "px";
      balloon.style.height = size + "px";
      balloon.style.backgroundColor = colors[colorIndex];
    }
  </script>
</body>
</html>
