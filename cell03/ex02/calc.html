<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Basic Calculator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #f4f4f4;
    }

    .calculator {
      padding: 20px 30px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 280px;
    }

    input[type="number"], select, input[type="submit"] {
      padding: 8px 12px;
      font-size: 16px;
      border-radius: 6px;
      border: 1px solid #ccc;
      width: 100%;
      box-sizing: border-box;
    }

    input[type="submit"] {
      background-color: #2563eb;
      color: white;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: background 0.2s;
    }

    input[type="submit"]:hover {
      background-color: #1d4ed8;
    }
  </style>
</head>
<body>

  <form class="calculator" id="calcForm">
    <input type="number" id="left" placeholder="Left number" min="0">
    <select id="operator">
      <option value="+">+</option>
      <option value="-">-</option>
      <option value="*">*</option>
      <option value="/">/</option>
      <option value="%">%</option>
    </select>
    <input type="number" id="right" placeholder="Right number" min="0">
    <input type="submit" value="Try me!">
  </form>

  <script>
    const form = document.getElementById("calcForm");
    const leftInput = document.getElementById("left");
    const rightInput = document.getElementById("right");
    const operatorSelect = document.getElementById("operator");

    form.addEventListener("submit", (e) => {
      e.preventDefault();

      const left = parseInt(leftInput.value);
      const right = parseInt(rightInput.value);
      const op = operatorSelect.value;

      // Validation: only positive integers >=0
      if (isNaN(left) || isNaN(right) || left < 0 || right < 0) {
        alert("Error :(");
        return;
      }

      // Division or modulo by zero
      if ((op === "/" || op === "%") && right === 0) {
        alert("It’s over 9000!");
        console.log("It’s over 9000!");
        return;
      }

      let result;
      switch(op) {
        case "+": result = left + right; break;
        case "-": result = left - right; break;
        case "*": result = left * right; break;
        case "/": result = left / right; break;
        case "%": result = left % right; break;
        default: result = "Unknown operator";
      }

      alert(result);
      console.log(result);
    });

    // Every 30 seconds, remind user to use the calculator
    setInterval(() => {
      alert("Please, use me...");
    }, 30000);
  </script>

</body>
</html>
